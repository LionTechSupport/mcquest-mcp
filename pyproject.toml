[project]
name = "mcquest-mcp"
version = "0.2.0"
description = "Read-only MCP server for the MCQuest codebase"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
]

[project.scripts]
mcquest-mcp = "mcquest_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcquest_mcp"]